services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moarix
      POSTGRES_USER: moarix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - moarix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moarix -d moarix"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://moarix:${POSTGRES_PASSWORD:-change-this-database-password}@database:5432/moarix
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to at least 32 random characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  moarix_postgres:
