name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_DRIVER: local
      LOCAL_DATABASE_PATH: /tmp/moarix-ci-${{ github.run_id }}/pglite
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      COOKIE_SECURE: "false"
      SEED_DEMO_EMAIL: admin@moarix.local
      SEED_DEMO_PASSWORD: Moarix-CI-Password-42!
      SMOKE_PASSWORD: Moarix-CI-Password-42!
      E2E_PASSWORD: Moarix-CI-Password-42!
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Scan repository for privacy leaks
        run: npm run test:privacy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Prepare database
        run: npm run db:setup

      - name: Build production bundle
        run: npm run build

      - name: Run domain and HTTP smoke tests
        run: npm run smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated browser database
        env:
          LOCAL_DATABASE_PATH: ${{ runner.temp }}/moarix-e2e-${{ github.run_id }}/pglite
        run: npm run db:setup

      - name: Run browser tests
        env:
          LOCAL_DATABASE_PATH: ${{ runner.temp }}/moarix-e2e-${{ github.run_id }}/pglite
        run: npm run test:e2e

      - name: Validate container image
        run: docker build -t moarix:ci .

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moarix
          POSTGRES_USER: moarix_owner
          POSTGRES_PASSWORD: MoarixOwnerCI42Secure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moarix_owner -d moarix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Migrate and provision restricted application role
        env:
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgresql://moarix_owner:MoarixOwnerCI42Secure@127.0.0.1:5432/moarix
          DATABASE_APP_USER: moarix_app
          DATABASE_APP_PASSWORD: MoarixAppCI42Secure
        run: node scripts/migrate-runtime.mjs

      - name: Verify owner-only first administrator bootstrap
        env:
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgresql://moarix_owner:MoarixOwnerCI42Secure@127.0.0.1:5432/moarix
          BOOTSTRAP_ADMIN_EMAIL: bootstrap-ci@example.invalid
          BOOTSTRAP_ADMIN_PASSWORD: Moarix-Bootstrap-CI-42!
          BOOTSTRAP_COMPANY_NAME: Synthetic Bootstrap Company
          BOOTSTRAP_COMPANY_SLUG: synthetic-bootstrap
        run: node scripts/bootstrap-admin.mjs

      - name: Verify PostgreSQL tenant isolation
        env:
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgresql://moarix_app:MoarixAppCI42Secure@127.0.0.1:5432/moarix
          DATABASE_OWNER_URL: postgresql://moarix_owner:MoarixOwnerCI42Secure@127.0.0.1:5432/moarix
          SESSION_SECRET: postgres-security-ci-session-secret-42
        run: npm run test:rls

      - name: Build PostgreSQL runtime and admin images
        run: |
          docker build -t moarix:postgres-security .
          docker build --target admin -t moarix:admin-ci .

      - name: Verify image CLI token lifecycle with restricted app role
        run: |
          token=$(docker run --rm --network host \
            --env DATABASE_DRIVER=postgres \
            --env DATABASE_URL=postgresql://moarix_owner:MoarixOwnerCI42Secure@127.0.0.1:5432/moarix \
            --env SESSION_SECRET=postgres-security-ci-session-secret-42 \
            moarix:admin-ci \
            node --import tsx scripts/issue-api-token.ts \
              --company synthetic-bootstrap \
              --email bootstrap-ci@example.invalid \
              --name 'Container lifecycle test' \
              --scopes context:read \
              --expires-in-days 1)
          if ! [[ "$token" =~ ^mxk_[A-Za-z0-9_-]{43}$ ]]; then
            echo 'Admin image did not return one valid API token' >&2
            exit 1
          fi

          container_id=$(docker run --detach --network host \
            --env DATABASE_DRIVER=postgres \
            --env DATABASE_URL=postgresql://moarix_app:MoarixAppCI42Secure@127.0.0.1:5432/moarix \
            --env SESSION_SECRET=postgres-security-ci-session-secret-42 \
            --env COOKIE_SECURE=false \
            moarix:postgres-security)
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null || true
          }
          trap cleanup EXIT
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:3000/api/health
          docker exec \
            --env MOARIX_URL=http://127.0.0.1:3000 \
            --env MOARIX_TOKEN="$token" \
            "$container_id" moarix context --machine > /tmp/moarix-cli-context.json
          node --input-type=module -e \
            'import fs from "node:fs"; const body=JSON.parse(fs.readFileSync("/tmp/moarix-cli-context.json","utf8")); if (!body.ok || body.data.company.name !== "Synthetic Bootstrap Company") process.exit(1)'

          docker run --rm --network host \
            --env DATABASE_DRIVER=postgres \
            --env DATABASE_URL=postgresql://moarix_owner:MoarixOwnerCI42Secure@127.0.0.1:5432/moarix \
            --env SESSION_SECRET=postgres-security-ci-session-secret-42 \
            --env API_TOKEN_COMPANY_SLUG=synthetic-bootstrap \
            --env API_TOKEN_PREFIX="${token:0:16}" \
            moarix:admin-ci \
            node --import tsx scripts/revoke-api-token.ts

          if docker exec \
            --env MOARIX_URL=http://127.0.0.1:3000 \
            --env MOARIX_TOKEN="$token" \
            "$container_id" moarix context --machine \
            > /tmp/moarix-revoked-stdout.json \
            2> /tmp/moarix-revoked-stderr.json; then
            echo 'Revoked API token was still accepted' >&2
            exit 1
          fi
          node --input-type=module -e \
            'import fs from "node:fs"; const body=JSON.parse(fs.readFileSync("/tmp/moarix-revoked-stderr.json","utf8")); if (body.ok || body.error.code !== "AUTH_REQUIRED" || body.meta.httpStatus !== 401) process.exit(1)'
